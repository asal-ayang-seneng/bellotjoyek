<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="theme-color" content="#ea580c" />
        <meta name="color-scheme" content="light dark" />
        <title>Kasir Warung — Aplikasi Kasir Resto & Warung</title>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
            :root {
                --bg: #faf6f1;
                --fg: #241f1a;
                --card: #ffffff;
                --ac: #ea580c;
                --ac-soft: #ffedd5;
                --ok: #16a34a;
                --warn: #d97706;
                --bad: #dc2626;
                --bd: #eae2d8;
                --mut: #8a8378;
                --shadow: 0 2px 10px rgba(90, 60, 20, 0.07);
                --shadow-lg: 0 10px 40px rgba(90, 60, 20, 0.16);
                --r: 14px;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #17130f;
                    --fg: #f3ede4;
                    --card: #211c16;
                    --ac: #fb923c;
                    --ac-soft: #3a2410;
                    --ok: #4ade80;
                    --warn: #fbbf24;
                    --bad: #f87171;
                    --bd: #35302a;
                    --mut: #a39c90;
                    --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
                    --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.5);
                }
            }
            * {
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
            }
            body {
                margin: 0;
                font: 15px/1.45 system-ui, 'Segoe UI', sans-serif;
                background: var(--bg);
                color: var(--fg);
            }
            h1,
            h2,
            h3 {
                margin: 0 0 8px;
            }
            small,
            .mut {
                color: var(--mut);
            }
            /* ---------- NAV ---------- */
            nav {
                display: flex;
                gap: 6px;
                padding: 10px 12px;
                background: var(--card);
                border-bottom: 1px solid var(--bd);
                overflow-x: auto;
                position: sticky;
                top: 0;
                z-index: 20;
                align-items: center;
            }
            nav .logo {
                font-weight: 800;
                font-size: 18px;
                white-space: nowrap;
                margin-right: 6px;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            input,
            select,
            textarea {
                font: inherit;
                color: inherit;
            }
            button {
                cursor: pointer;
                border: 1.5px solid var(--bd);
                background: var(--card);
                border-radius: 10px;
                padding: 9px 12px;
                transition: 0.15s;
                white-space: nowrap;
            }
            textarea {
                padding: 11px 12px;
                border: 1.5px solid var(--bd);
                border-radius: 10px;
                background: var(--card);
                width: 100%;
                resize: vertical;
                font: inherit;
                color: inherit;
            }
            button:hover {
                border-color: var(--ac);
            }
            input,
            select {
                padding: 11px 12px;
                border: 1.5px solid var(--bd);
                border-radius: 10px;
                background: var(--card);
                width: 100%;
            }
            input:focus,
            select:focus {
                outline: none;
                border-color: var(--ac);
                box-shadow: 0 0 0 3px color-mix(in srgb, var(--ac) 20%, transparent);
            }
            .pri {
                background: var(--ac) !important;
                color: #fff !important;
                border-color: var(--ac) !important;
                font-weight: 700;
            }
            .pri:hover {
                filter: brightness(1.08);
            }
            .big {
                padding: 14px 18px;
                font-size: 16px;
                border-radius: 12px;
            }
            nav button.t {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1px;
                padding: 6px 12px;
                border-radius: 12px;
                border-color: transparent;
                background: transparent;
                font-size: 12px;
                min-width: 68px;
            }
            nav button.t i {
                font-style: normal;
                font-size: 20px;
            }
            nav button.t.on {
                background: var(--ac-soft);
                color: var(--ac);
                border-color: color-mix(in srgb, var(--ac) 35%, transparent);
                font-weight: 700;
            }
            nav .sp {
                flex: 1;
            }
            /* ---------- HAMBURGER (mobile drawer) ---------- */
            .hamb {
                display: none;
            }
            #back {
                position: fixed;
                inset: 0;
                background: rgba(20, 12, 4, 0.45);
                backdrop-filter: blur(2px);
                opacity: 0;
                pointer-events: none;
                transition: 0.2s;
                z-index: 44;
            }
            #back.on {
                opacity: 1;
                pointer-events: auto;
            }
            /* ---------- LAYOUT ---------- */
            #main {
                padding: 14px;
                max-width: 1200px;
                margin: auto;
                padding-bottom: 60px;
            }
            .panel {
                background: var(--card);
                border: 1px solid var(--bd);
                border-radius: var(--r);
                padding: 16px;
                box-shadow: var(--shadow);
            }
            .g2 {
                display: grid;
                grid-template-columns: 1fr 360px;
                gap: 14px;
                align-items: start;
            }
            @media (max-width: 820px) {
                .g2 {
                    grid-template-columns: 1fr;
                }
            }
            .pagetitle {
                display: flex;
                align-items: center;
                gap: 10px;
                margin: 4px 2px 12px;
            }
            .pagetitle .ic {
                font-size: 30px;
                background: var(--ac-soft);
                border-radius: 12px;
                width: 46px;
                height: 46px;
                display: grid;
                place-items: center;
            }
            .hint {
                background: var(--ac-soft);
                color: color-mix(in srgb, var(--ac) 75%, var(--fg));
                border-radius: 10px;
                padding: 9px 12px;
                font-size: 13.5px;
                margin-bottom: 12px;
            }
            .row {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                align-items: center;
                margin-bottom: 10px;
            }
            .field {
                flex: 1;
                min-width: 130px;
            }
            .field label {
                display: block;
                font-size: 12.5px;
                font-weight: 700;
                margin: 0 0 4px 2px;
            }
            .field small {
                display: block;
                margin: 3px 2px 0;
                font-size: 11.5px;
            }
            /* ---------- MENU GRID (Kasir) ---------- */
            .chips {
                display: flex;
                gap: 8px;
                overflow-x: auto;
                padding-bottom: 6px;
                margin-bottom: 10px;
            }
            .chip {
                border: 1.5px solid var(--bd);
                background: var(--card);
                border-radius: 999px;
                padding: 7px 14px;
                font-weight: 600;
                font-size: 13.5px;
            }
            .chip.on {
                background: var(--ac);
                border-color: var(--ac);
                color: #fff;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 10px;
                align-content: start;
            }
            .mcard {
                display: flex;
                flex-direction: column;
                gap: 4px;
                text-align: left;
                padding: 12px;
                border-radius: var(--r);
                border: 1.5px solid var(--bd);
                background: var(--card);
                box-shadow: var(--shadow);
                min-height: 104px;
                position: relative;
            }
            .mcard:hover,
            .mcard:active {
                border-color: var(--ac);
                transform: translateY(-2px);
            }
            .mcard .em {
                font-size: 26px;
                display: block;
            }
            .cline svg,
            td svg {
                margin-right: 2px;
            }
            .mcard b {
                font-size: 14.5px;
                line-height: 1.25;
            }
            .mcard .pr {
                color: var(--ac);
                font-weight: 800;
                margin-top: auto;
            }
            .mcard .cat {
                font-size: 11px;
                color: var(--mut);
            }
            /* ---------- CART ---------- */
            #cartPanel {
                position: sticky;
                top: 76px;
            }
            .cline {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 0;
                border-bottom: 1px dashed var(--bd);
            }
            .cline .nm {
                flex: 1;
                font-weight: 600;
            }
            .qtybox {
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .qtybox button {
                width: 32px;
                height: 32px;
                padding: 0;
                font-size: 18px;
                font-weight: 800;
                border-radius: 9px;
                line-height: 1;
            }
            .qtybox .q {
                min-width: 20px;
                text-align: center;
                font-weight: 800;
            }
            .cline .sub {
                min-width: 78px;
                text-align: right;
                font-weight: 700;
                font-size: 13.5px;
            }
            .paym {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
                margin-bottom: 10px;
            }
            .paym button {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2px;
                padding: 10px 4px;
                font-size: 12.5px;
                font-weight: 700;
            }
            .paym button i {
                font-style: normal;
                font-size: 22px;
            }
            .paym button.on {
                background: var(--ac-soft);
                border-color: var(--ac);
                color: var(--ac);
            }
            .totalbar {
                background: var(--ac);
                color: #fff;
                border-radius: 12px;
                padding: 12px 14px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin: 10px 0;
            }
            .totalbar b {
                font-size: 22px;
            }
            /* ---------- TABLES ---------- */
            .tw {
                overflow-x: auto;
                border-radius: var(--r);
                border: 1px solid var(--bd);
                background: var(--card);
            }
            table {
                width: 100%;
                border-collapse: collapse;
            }
            th,
            td {
                padding: 10px 12px;
                border-bottom: 1px solid var(--bd);
                text-align: left;
                white-space: nowrap;
                font-size: 14px;
            }
            th {
                background: color-mix(in srgb, var(--ac-soft) 55%, transparent);
                font-size: 12.5px;
                text-transform: uppercase;
                letter-spacing: 0.4px;
                color: color-mix(in srgb, var(--ac) 70%, var(--fg));
            }
            tr:last-child td {
                border-bottom: none;
            }
            /* ---------- KPI ---------- */
            .kpi {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
                gap: 10px;
                margin: 12px 0;
            }
            .kpi div {
                background: var(--card);
                border: 1px solid var(--bd);
                border-radius: var(--r);
                padding: 14px;
                box-shadow: var(--shadow);
            }
            .kpi small {
                font-weight: 600;
            }
            .kpi b {
                display: block;
                font-size: 21px;
                margin-top: 2px;
            }
            .badge {
                display: inline-block;
                padding: 3px 10px;
                border-radius: 999px;
                font-size: 12px;
                font-weight: 700;
            }
            .b-ok {
                background: color-mix(in srgb, var(--ok) 15%, transparent);
                color: var(--ok);
            }
            .b-warn {
                background: color-mix(in srgb, var(--warn) 15%, transparent);
                color: var(--warn);
            }
            .b-bad {
                background: color-mix(in srgb, var(--bad) 15%, transparent);
                color: var(--bad);
            }
            .low {
                color: var(--bad);
                font-weight: 700;
            }
            /* ---------- EMPTY STATE ---------- */
            .empty {
                text-align: center;
                padding: 40px 16px;
                color: var(--mut);
            }
            .empty .e {
                font-size: 44px;
            }
            /* ---------- LOGIN ---------- */
            #login {
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: linear-gradient(160deg, var(--ac-soft), var(--bg) 60%);
                color: var(--fg);
            }
            #login .card {
                background: var(--card);
                border: 1px solid var(--bd);
                border-radius: 20px;
                padding: 28px 24px;
                width: min(370px, 92vw);
                box-shadow: var(--shadow-lg);
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            #login .lg {
                font-size: 46px;
                text-align: center;
            }
            .err {
                background: color-mix(in srgb, var(--bad) 12%, transparent);
                color: var(--bad);
                padding: 9px 12px;
                border-radius: 10px;
                font-size: 13.5px;
                display: none;
            }
            /* ---------- MODAL & TOAST ---------- */
            #ovl {
                position: fixed;
                inset: 0;
                background: rgba(20, 12, 4, 0.5);
                backdrop-filter: blur(3px);
                display: none;
                place-items: center;
                z-index: 50;
                padding: 16px;
            }
            #ovl.on {
                display: grid;
            }
            #box {
                background: var(--card);
                border-radius: 18px;
                padding: 22px;
                width: min(430px, 94vw);
                max-height: 86vh;
                overflow: auto;
                box-shadow: var(--shadow-lg);
                animation: pop 0.18s;
            }
            @keyframes pop {
                from {
                    transform: scale(0.92);
                    opacity: 0;
                }
            }
            #box .xic {
                font-size: 38px;
                text-align: center;
                margin-bottom: 6px;
            }
            #box p.desc {
                color: var(--mut);
                margin: 4px 0 14px;
                font-size: 14px;
            }
            .mbtns {
                display: flex;
                gap: 8px;
                margin-top: 16px;
            }
            .mbtns button {
                flex: 1;
                padding: 12px;
                font-weight: 700;
                font-size: 15px;
            }
            #toast {
                position: fixed;
                bottom: 22px;
                left: 50%;
                transform: translateX(-50%) translateY(20px);
                background: var(--fg);
                color: var(--bg);
                padding: 11px 18px;
                border-radius: 999px;
                font-weight: 600;
                font-size: 14px;
                opacity: 0;
                pointer-events: none;
                transition: 0.25s;
                z-index: 60;
                max-width: 92vw;
            }
            #toast.on {
                opacity: 1;
                transform: translateX(-50%);
            }
            /* success modal */
            .sucess-c {
                text-align: center;
            }
            .sucess-c .xn {
                font-size: 54px;
                line-height: 1;
            }
            .receipt {
                background: var(--ac-soft);
                border-radius: 12px;
                padding: 12px;
                margin: 12px 0;
                text-align: left;
            }
            /* quick date buttons */
            .qdate {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
            }
            .qdate button {
                font-size: 13px;
                padding: 7px 12px;
                border-radius: 999px;
            }
            .qdate button.on {
                background: var(--ac-soft);
                border-color: var(--ac);
                color: var(--ac);
                font-weight: 700;
            }
            .pill-emoji {
                font-size: 20px;
            }

            /* ================= v3 — TAMPILAN PROFESIONAL ================= */
            body {
                font-family: Inter, system-ui, 'Segoe UI', sans-serif;
                font-size: 14px;
                -webkit-font-smoothing: antialiased;
            }
            :root {
                --bg: #f6f7f9;
                --fg: #171b22;
                --card: #ffffff;
                --ac: #ea580c;
                --ac-soft: #fff1e7;
                --bd: #e7e9ee;
                --mut: #8a8f98;
                --r: 10px;
                --shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
                --shadow-lg: 0 12px 32px rgba(16, 24, 40, 0.14);
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #121417;
                    --fg: #eceef1;
                    --card: #1a1d21;
                    --ac: #fb923c;
                    --ac-soft: #33241a;
                    --bd: #2a2e34;
                    --mut: #9aa1ab;
                    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
                    --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.55);
                }
                /* teks selalu terang & terbaca di tema gelap */
                body,
                button,
                input,
                select,
                textarea,
                h1,
                h2,
                h3,
                b,
                strong,
                td,
                label,
                li,
                p {
                    color: #eceff3;
                }
                small,
                .mut,
                th {
                    color: var(--mut);
                }
                .mcard b,
                .cline .nm {
                    color: #f2f4f7;
                }
                .pri,
                .totalbar {
                    color: #fff;
                }
                .mcard:hover,
                .mcard:active {
                    border-color: var(--ac);
                }
            }
            h2 {
                font-size: 16.5px;
                font-weight: 700;
                letter-spacing: -0.2px;
            }
            /* --- shell sidebar --- */
            .shell {
                display: grid;
                grid-template-columns: 234px 1fr;
                min-height: 100vh;
            }
            aside {
                border-right: 1px solid var(--bd);
                background: var(--card);
                position: sticky;
                top: 0;
                height: 100vh;
                overflow-y: auto;
            }
            .side-inner {
                display: flex;
                flex-direction: column;
                gap: 2px;
                padding: 16px 12px;
                height: 100%;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 2px 6px 16px;
            }
            .brand .mark {
                display: inline-grid;
                place-items: center;
                width: 34px;
                height: 34px;
                flex: none;
                background: var(--ac);
                color: #fff;
                border-radius: 9px;
            }
            .brand b {
                font-size: 14px;
                line-height: 1.2;
                display: block;
            }
            .brand small {
                color: var(--mut);
                font-size: 10.5px;
                font-weight: 500;
            }
            #login .lg {
                display: flex;
                justify-content: center;
                font-size: 0;
                margin-bottom: 12px;
            }
            #login .lg .mark {
                display: inline-grid;
                place-items: center;
                width: 52px;
                height: 52px;
                background: var(--ac);
                color: #fff;
                border-radius: 14px;
            }
            .grow {
                flex: 1;
            }
            aside .t {
                display: flex;
                align-items: center;
                gap: 10px;
                width: 100%;
                text-align: left;
                padding: 9px 12px;
                border: none;
                background: transparent;
                border-radius: 8px;
                color: var(--mut);
                font-size: 13.5px;
                font-weight: 600;
            }
            aside .t:hover {
                background: color-mix(in srgb, var(--fg) 5%, transparent);
                color: var(--fg);
            }
            aside .t.on {
                background: var(--ac-soft);
                color: var(--ac);
            }
            .who {
                font-size: 10.5px;
                color: var(--mut);
                padding: 0 12px 8px;
                word-break: break-all;
            }
            .outb {
                display: flex;
                align-items: center;
                gap: 10px;
                width: 100%;
                text-align: left;
                padding: 9px 12px;
                border: none;
                background: transparent;
                border-radius: 8px;
                color: var(--mut);
                font-size: 13.5px;
                font-weight: 600;
            }
            .outb:hover {
                background: color-mix(in srgb, var(--bad) 10%, transparent);
                color: var(--bad);
            }
            @media (max-width: 960px) {
                .shell {
                    grid-template-columns: 1fr;
                }
                aside {
                    position: fixed;
                    top: 0;
                    left: 0;
                    height: 100vh;
                    width: min(300px, 84vw);
                    border-right: 1px solid var(--bd);
                    border-bottom: none;
                    transform: translateX(-104%);
                    transition: transform 0.22s ease;
                    z-index: 45;
                    box-shadow: var(--shadow-lg);
                }
                aside.open {
                    transform: translateX(0);
                }
                .side-inner {
                    flex-direction: column;
                    align-items: stretch;
                    height: 100%;
                    overflow-y: auto;
                    overflow-x: visible;
                    padding: 14px;
                    gap: 3px;
                }
                .brand {
                    flex: none;
                    padding: 0 4px 12px;
                    margin: 0 0 10px;
                    border-right: none;
                    border-bottom: 1px solid var(--bd);
                }
                .brand .mark {
                    width: 32px;
                    height: 32px;
                    border-radius: 8px;
                }
                .brand small,
                .brand b,
                .who {
                    display: none;
                }
                .grow {
                    display: none;
                }
                aside .t,
                .outb {
                    flex: none;
                    flex-direction: row;
                    min-width: 0;
                    width: 100%;
                    gap: 10px;
                    padding: 10px 12px;
                    font-size: 13.5px;
                    font-weight: 600;
                    text-align: left;
                    white-space: nowrap;
                    overflow: visible;
                    line-height: 1.2;
                    border: none;
                    background: transparent;
                    border-radius: 8px;
                    color: var(--mut);
                }
                aside .t svg,
                .outb svg {
                    width: 20px;
                    height: 20px;
                }
                aside .t:hover,
                .outb:hover {
                    background: color-mix(in srgb, var(--fg) 6%, transparent);
                    color: var(--fg);
                }
                aside .t.on {
                    background: var(--ac-soft);
                    color: var(--ac);
                }
                .outb {
                    color: var(--mut);
                    border-left: none;
                    width: 100%;
                    padding: 10px 12px;
                    margin-top: 8px;
                }
                .outb .ob-l {
                    display: inline;
                }
                .hamb {
                    display: inline-grid;
                    place-items: center;
                    position: fixed;
                    top: 12px;
                    right: 14px;
                    z-index: 46;
                    width: 42px;
                    height: 42px;
                    border-radius: 12px;
                    border: 1px solid var(--bd);
                    background: var(--card);
                    color: var(--fg);
                    box-shadow: var(--shadow);
                }
                #main {
                    padding: 14px;
                    padding-bottom: 60px;
                    max-width: 100%;
                }
                .pagetitle .ic {
                    display: none;
                }
                .kpi {
                    grid-template-columns: repeat(2, 1fr) !important;
                }
                .kpi b {
                    font-size: 17px;
                }
            }

                if (!$('#toast')) document.body.insertAdjacentHTML('beforeend', '<div id="toast"></div>');
            }
            let tTimer;
            function toast(m) {
                ensurePopups();
                const el = $('#toast');
                el.textContent = m;
                el.classList.add('on');
                clearTimeout(tTimer);
                tTimer = setTimeout(() => el.classList.remove('on'), 2600);
            }
            function modal(html) {
                ensurePopups();
                $('#box').innerHTML = html;
                $('#ovl').classList.add('on');
            }
            function closeModal() {
                $('#ovl').classList.remove('on');
            }
            function confirmDlg(icon, title, desc, onOkName, okLabel = 'Ya, Lanjutkan') {
                modal(`<div class="xic">${icon}</div><h3>${title}</h3><p class="desc">${desc}</p>
                <div class="mbtns"><button onclick="closeModal()">Batal</button><button class="pri" onclick="${onOkName}">${okLabel}</button></div>`);
            }

            /* merender konten ke wadah #app tanpa menghapus popup (#ovl) & notifikasi (#toast) */
            function setApp(html) {
                let app = document.getElementById('app');
                if (!app) {
                    app = document.createElement('div');
                    app.id = 'app';
                    document.body.appendChild(app);
                }
                app.innerHTML = html;
                return app;
            }

            /* ===== LOGIN ===== */
            function loginUI() {
                setApp(`<div id="login"><div class="card">
                <div class="lg"><span class="mark">${MARK}</span></div>
                <h2 style="text-align:center">Kasir Warung</h2>
                <p class="mut" style="text-align:center;margin:0 0 8px">Masuk dengan akun kasir Anda<br>untuk mulai mencatat penjualan.</p>

                <div class="field"><label>Kata Sandi</label><input id="p" type="password" placeholder="••••••••" autocomplete="current-password"></div>
                <button class="pri big" onclick="doLogin()">Masuk</button>
                <small style="text-align:center">Lupa kata sandi? Hubungi pemilik warung untuk reset.</small>
            </div></div>`);
            }
            async function doLogin() {
                const err = $('#err');
                err.style.display = 'none';
                const { error } = await sb.auth.signInWithPassword({ email: $('#e').value.trim(), password: $('#p').value });
                if (error) {
                    err.textContent = '⚠️ ' + (error.message.includes('Invalid login') ? 'Email atau kata sandi salah. Coba lagi ya.' : error.message);
                    err.style.display = 'block';
                } else {
                    logEvent('MASUK', { email: $('#e').value.trim() });
                    start();
                }
            }

            /* ===== APP ===== */
            async function start() {
                const { data } = await sb.auth.getSession();
                if (!data.session) return loginUI();
                user = data.session.user.email;
                setApp(`<div id="back" onclick="closeNav()"></div><div class="shell"><button class="hamb" onclick="togNav()" aria-label="Buka menu">${lic('hamb', 22, 2.2)}</button><aside><div class="side-inner">
                <div class="brand"><span class="mark">${MARK}</span><span><b>Kasir Warung</b><br><small>Sistem Penjualan</small></span></div>
                ${[
                    ['kasir', 'Kasir'],
                    ['menu', 'Menu'],
                    ['bahan', 'Bahan'],
                    ['biaya', 'Biaya'],
                    ['laporan', 'Laporan'],
                    ['riwayat', 'Riwayat'],
                    ['riset', 'Riset'],
                ]
                    .map((x) => `<button class="t" data-t="${x[0]}" onclick="show('${x[0]}')">${PI[x[0]]}${x[1]}</button>`)
                    .join(
                        ''
                    )}<span class="grow"></span><div class="who">${esc(user)}</div><button class="outb" onclick="outAsk()">${lic('keluar')}<span class="ob-l">Keluar</span></button></div></aside><div id="main"></div></div>`);
                load();
            }
            function outAsk() {
                confirmDlg(lic('keluar', 36), 'Keluar dari aplikasi?', 'Pesanan yang belum dibayar akan hilang. Semua data yang sudah tersimpan aman di server.', 'doLogout()');
            }
            async function doLogout() {
                closeModal();
                await logEvent('KELUAR', { email: user });
                await sb.auth.signOut();
                loginUI();
            }
            /* drawer navigasi (mobile) */

                if (b) b.classList.toggle('on', open);
                document.body.style.overflow = open ? 'hidden' : '';

                const a = document.querySelector('aside');
                if (a) setNav(!a.classList.contains('open'));
            }
            function closeNav() {
                setNav(false);
            }

                              .map(

: `<div class="panel empty"><div class="e">${lic('biaya', 40)}</div><h3>Belum ada ${isOut ? 'pengeluaran' : 'pemasukan'} dicatat</h3><p>${isOut ? 'Setiap kali keluar uang untuk warung (bensin, gas, gaji), catat di form atas.' : 'Jika ada uang masuk di luar penjualan kasir (modal, setoran), catat di form atas.'}</p></div>`

                ${
                    logRpcOk
                        ? ''
                        : `<div class="panel" style="border-color:color-mix(in srgb,var(--bad) 45%,transparent);margin-bottom:14px">
                    <b style="color:var(--bad)">⚠️ Pencatatan riwayat (keluar/masuk/hapus) belum aktif di database</b>
                    <p class="mut" style="font-size:13px;margin:6px 0 10px">Solusi sekali saja: buka <b>supabase.com</b> → proyek Anda → <b>SQL Editor</b> → tempel SQL di bawah → tekan <b>Run</b> → lalu muat ulang aplikasi (Ctrl+F5). SQL yang sama juga ada di bagian bawah file <b>Schema.sql</b>.</p>
                    <div class="tw" style="margin-bottom:10px"><pre style="margin:0;padding:12px;overflow:auto;font-size:12px;line-height:1.5;white-space:pre-wrap">create or replace function app_event(p_action text, p_detail jsonb default '{}'::jsonb)
returns void language plpgsql security definer as $$
begin
  insert into activity_log(user_email, action, tbl, detail)
  values (auth.jwt()-&gt;&gt;'email', upper(p_action), 'sesi', p_detail);
end $$;</pre></div>
                    <button class="pri big" onclick="testLog()">${lic('ok', 16, 2.2)}Uji Pencatatan Sekarang</button>
                  </div>`
                }
                ${
                    D.log.length
                        ? `<div class="tw" id="logtw"><table><tr><th>Waktu</th><th>Oleh</th><th>Kegiatan</th><th>Berupa</th><th>Data</th></tr>${D.log.map((l) => {
                              const a = ACT[l.action] || [l.action, l.action];
                              return `<tr><td>${dt(l.created_at)}</td><td>${esc(l.user_email || '')}</td><td><b>${a[0]} ${a[1]}</b></td><td>${esc(TBL[l.tbl] || l.tbl)}</td><td><small>${esc(JSON.stringify(l.detail)).slice(0, 110)}</small></td></tr>`;
                          }).join('')}</table></div>`
: `<div class="panel empty"><div class="e">${lic('riwayat', 40)}</div><h3>Belum ada aktivitas</h3><p>Riwayat akan terisi otomatis begitu Anda mulai menambah menu, bahan, atau transaksi.</p></div>`
                }`;
                },

                /* ================= RISET & ARSIP ================= */
                riset() {
                    const ds = today(),
                        s = calcDay(ds),
                        arch = D.daily || [],
                        cur = arch.find((x) => (x.stat_date || '').slice(0, 10) === ds),
                        nota = (cur && cur.payload && cur.payload.catatan) || '',
                        fd = (d) => new Date(d + 'T12:00:00').toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }),
                        stashok = s.jam_tersibuk ? `${s.jam_tersibuk[0]}:00 (${s.jam_tersibuk[1]} transaksi)` : '—';
                    $('#main').innerHTML = `<div class="pagetitle"><div class="ic">${PI.riset}</div><div><h2>Riset & Arsip Harian</h2><small>Ringkasan riset per hari: arus uang, menu terlaris, jam tersibuk, kondisi stok. Sekali simpan → tersimpan permanen di sini seperti database kasir.</small></div></div>
                ${
                    dailyOk
                        ? ''
                        : `<div class="hint" style="background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)">⚠️ Tabel arsip "daily_stats" belum ada di database Supabase. Jalankan SQL bagian <b>Arsip Riset Harian</b> dari file <b>Schema.sql</b> di Supabase → SQL Editor (sekali saja), lalu muat ulang halaman.</div>`
                }
                <div class="panel" style="margin-bottom:14px">
                  <div class="row" style="justify-content:space-between">
                    <b style="font-size:15px">Riset Hari Ini — ${fd(ds)}</b>
                    ${cur ? '<span class="badge b-ok">Tersimpan di arsip</span>' : '<span class="badge b-warn">Belum tersimpan</span>'}
                  </div>
                  <div class="kpi">
                    <div><small>Transaksi</small><b>${s.transaksi}×</b></div>
                    <div><small>Pemasukan Kasir</small><b style="color:var(--ok)">${rp(s.pemasukan_kasir)}</b></div>
                    <div><small>Pemasukan Lain</small><b style="color:var(--ok)">${s.pemasukan_lain ? rp(s.pemasukan_lain) : '—'}</b></div>
                    <div><small>Pengeluaran</small><b style="color:var(--bad)">${rp(s.pengeluaran)}</b></div>
                    <div><small>Laba Hari Ini</small><b style="color:${s.laba >= 0 ? 'var(--ok)' : 'var(--bad)'}">${rp(s.laba)}</b></div>
                  </div>
                  <div class="g2">
                    <div class="panel" style="box-shadow:none;margin:0">
                      <b>Menu Terlaris Hari Ini</b>
                      ${
                          s.top_menu.length
                              ? `<div class="tw" style="margin-top:8px"><table><tr><th>Menu</th><th>Terjual</th><th>Pendapatan</th></tr>${s.top_menu.map((t) => `<tr><td>${esc(t.nama)}</td><td>${t.qty}×</td><td><b>${rp(t.pendapatan)}</b></td></tr>`).join('')}</table></div>`
                              : '<p class="mut" style="margin:8px 0 0">Belum ada penjualan hari ini.</p>'
                      }
                      <p class="mut" style="margin:10px 0 0;font-size:13px">⏱️ Jam tersibuk: <b>${stashok}</b><br>🧮 Rata-rata per transaksi: <b>${rp(s.rata_per_transaksi)}</b></p>
                    </div>
                    <div class="panel" style="box-shadow:none;margin:0">
                      <b>Kondisi Stok (snapshot hari ini)</b>
                      ${
                          s.stok.length
                              ? `<div class="tw" style="margin-top:8px"><table><tr><th>Bahan</th><th>Stok</th><th>Kondisi</th></tr>${s.stok.map((x) => {
                                    const rendah = x.min > 0 && x.stok <= x.min;
                                    return `<tr><td>${esc(x.nama)}</td><td class="${rendah ? 'low' : ''}">${x.stok} ${esc(x.unit)}</td><td>${rendah ? '<span class="badge b-bad">Segera beli</span>' : '<span class="badge b-ok">Aman</span>'}</td></tr>`;
                                }).join('')}</table></div>`
                              : '<p class="mut" style="margin:8px 0 0">Belum ada bahan baku.</p>'
                      }
                    </div>
                  </div>
                  <div class="field" style="margin-top:12px"><label>Catatan pemilik / kasir (ikut tersimpan di arsip)</label><textarea id="rnote" rows="2" placeholder="Contoh: hujan seharian, pelanggan sepi. Beli gas 3kg dari saldo warung.">${esc(nota)}</textarea></div>
                  <div class="row" style="margin:12px 0 0">
                    <button class="pri big" onclick="saveSnap(false)">${cur ? 'Perbarui Arsip Hari Ini' : 'Simpan Riset ke Arsip'}</button>
                    <button class="big" onclick="show('laporan')">Buka Laporan</button>
                  </div>
                </div>
                <div class="panel">
                  <div class="row" style="justify-content:space-between">
                    <b style="font-size:15px">Arsip Riset Harian (${arch.length} hari tersimpan)</b>
                    <button onclick="exportRiset()">${lic('unduh', 16, 2)}Unduh Excel Arsip</button>
                  </div>
                  ${
                      arch.length
                          ? `<div class="tw" style="margin-top:10px"><table><tr><th>Tanggal</th><th>Transaksi</th><th>Pemasukan</th><th>Pengeluaran</th><th>Laba</th><th>Jam Sibuk</th><th style="min-width:110px">Aksi</th></tr>${arch
                                .map((x) => {
                                    const p = x.payload || {};
                                    const jb = Array.isArray(p.jam_tersibuk) ? p.jam_tersibuk[0] + ':00' : '—';
                                    return `<tr><td><b>${fd(x.stat_date)}</b></td><td>${p.transaksi || 0}×</td><td style="color:var(--ok)"><b>${rp(p.pemasukan_total || 0)}</b></td><td style="color:var(--bad)">${rp(p.pengeluaran || 0)}</td><td style="color:${(p.laba || 0) >= 0 ? 'var(--ok)' : 'var(--bad)'}"><b>${rp(p.laba || 0)}</b></td><td>${jb}</td><td><button onclick="openSnap(${x.id})">Lihat</button> <button class="d" onclick="delSnapAsk(${x.id})">Hapus</button></td></tr>`;
                                }).join('')}</table></div>`
                          : `<div class="empty"><div class="e">${lic('riset', 40)}</div><h3>Arsip masih kosong</h3><p>Tekan <b>Simpan Riset ke Arsip</b> di panel atas. Setiap hari akan jadi satu baris riset yang tersimpan permanen di sini.</p></div>`
                  }
                </div>`;
                },
            };

            /* ===== RISET HARIAN ===== */
            function calcDay(ds) {
                const o = D.orders.filter((x) => x.created_at.slice(0, 10) === ds),
                    oids = o.map((x) => x.id),
                    oi = D.order_items.filter((x) => oids.includes(x.order_id)),
                    eOut = D.expenses.filter((x) => x.created_at.slice(0, 10) === ds && (x.kind || 'keluar') == 'keluar'),
                    eIn = D.expenses.filter((x) => x.created_at.slice(0, 10) === ds && x.kind == 'masuk'),
                    incSales = o.reduce((a, x) => a + +x.total, 0),
                    incOther = eIn.reduce((a, x) => a + +x.amount, 0),
                    out = eOut.reduce((a, x) => a + +x.amount, 0),
                    inc = incSales + incOther;
                const top = {};
                oi.forEach((x) => {
                    const t = top[x.name] || (top[x.name] = { nama: x.name, qty: 0, pendapatan: 0 });
                    t.qty += x.qty;
                    t.pendapatan += +x.price * x.qty;
                });
                const metode = {};
                o.forEach((x) => (metode[x.payment_method] = (metode[x.payment_method] || 0) + +x.total));
                const jam = {};
                o.forEach((x) => {
                    const h = new Date(x.created_at).getHours();
                    jam[h] = (jam[h] || 0) + 1;
                });
                const b = Object.entries(jam).sort((a, x) => x[1] - a[1])[0];
                return {
                    tanggal: ds,
                    transaksi: o.length,
                    pemasukan_kasir: incSales,
                    pemasukan_lain: incOther,
                    pemasukan_total: inc,
                    pengeluaran: out,
                    laba: inc - out,
                    rata_per_transaksi: o.length ? Math.round(inc / o.length) : 0,
                    metode,
                    top_menu: Object.values(top).sort((a, x) => x.qty - a.qty).slice(0, 8),
                    jam_tersibuk: b ? [b[0], b[1]] : null,
                    stok: D.ingredients.map((i) => ({ nama: i.name, unit: i.unit, stok: +i.stock, min: +i.min_stock })),
                    menu_aktif: D.menu_items.filter((m) => m.active).length,
                    pengeluaran_detail: eOut.map((x) => ({ kategori: x.category, jumlah: +x.amount, catatan: x.note || '' })),
                    pemasukan_detail: eIn.map((x) => ({ kategori: x.category, jumlah: +x.amount, catatan: x.note || '' })),
                };
            }
            function snapHint(e) {
                return e.message.includes('daily_stats') || e.message.includes('schema cache') ? ' → Jalankan SQL "Arsip Riset Harian" dari Schema.sql di Supabase dulu ya.' : '';
            }
            async function saveSnap(silent) {
                const ds = today(),
                    note = ($('#rnote') || {}).value || '',
                    p = calcDay(ds);
                p.catatan = note.trim();
                const { error } = await sb.from('daily_stats').upsert({ stat_date: ds, payload: p, user_email: user });
                if (error) return void (silent || toast('⚠️ Gagal menyimpan arsip: ' + error.message + snapHint(error)));
                logEvent('SIMPAN_RISET', { tanggal: ds, transaksi: p.transaksi, laba: p.laba });
                if (!silent) {
                    toast('✅ Riset hari ini tersimpan di arsip');
                    await load();
                }
            }
            /* otomatis: saat checkout pertama hari itu, arsip langsung dibuat */
            async function autoSnap() {
                if (!(D.daily || []).some((x) => (x.stat_date || '').slice(0, 10) === today())) saveSnap(true);
            }
            function delSnapAsk(id) {
                const r = (D.daily || []).find((x) => x.id == id) || {};
                confirmDlg(lic('hapus', 36), `Hapus arsip riset ${r.stat_date}?`, 'Snapshot riset hari itu terhapus permanen. Transaksi asli tetap aman dan bisa di-riset ulang kapan saja.', 'doDelSnap(' + id + ')', 'Ya, Hapus Arsip');
            }
            async function doDelSnap(id) {
                closeModal();
                const r = (D.daily || []).find((x) => x.id == id) || {},
                    { error } = await sb.from('daily_stats').delete().eq('id', id);
                if (error) return toast('⚠️ Gagal: ' + error.message);
                logEvent('HAPUS_ARSIP', { tanggal: r.stat_date });
                toast('✅ Arsip dihapus');
                await load();
            }
            function openSnap(id) {
                const r = (D.daily || []).find((x) => x.id == id);
                if (!r) return;
                const s = r.payload || {},
                    fd = new Date(r.stat_date + 'T12:00:00').toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
                const jb = Array.isArray(s.jam_tersibuk) ? s.jam_tersibuk[0] + ':00 (' + s.jam_tersibuk[1] + ' transaksi)' : '—';
                modal(`<h3 style="text-align:center;font-size:17px">🔬 Riset — ${fd}</h3>
                <div class="kpi" style="grid-template-columns:repeat(2,1fr);margin-top:12px">
                  <div><small>Pemasukan Total</small><b style="color:var(--ok)">${rp(s.pemasukan_total || 0)}</b></div>
                  <div><small>Pengeluaran</small><b style="color:var(--bad)">${rp(s.pengeluaran || 0)}</b></div>
                  <div><small>Laba</small><b style="color:${(s.laba || 0) >= 0 ? 'var(--ok)' : 'var(--bad)'}">${rp(s.laba || 0)}</b></div>
                  <div><small>Transaksi</small><b>${s.transaksi || 0}×</b></div>
                </div>
                <p class="desc" style="margin:10px 0 6px">⏱️ <b>${jb}</b> · 🧮 rata-rata ${rp(s.rata_per_transaksi || 0)} · 🍽️ ${s.menu_aktif || 0} menu aktif</p>
                ${
                    (s.top_menu || []).length
                        ? `<div class="tw"><table><tr><th>Menu Terlaris</th><th>Qty</th><th>Pendapatan</th></tr>${s.top_menu.map((t) => `<tr><td>${esc(t.nama)}</td><td>${t.qty}×</td><td><b>${rp(t.pendapatan)}</b></td></tr>`).join('')}</table></div>`
                        : ''
                }
                ${s.catatan ? `<div class="receipt" style="margin-top:10px"><b>Catatan:</b> ${esc(s.catatan)}</div>` : ''}
                <p class="desc" style="margin-top:8px">Tersimpan oleh ${esc(r.user_email || '')} pada ${dt(r.created_at)}</p>
                <div class="mbtns"><button onclick="closeModal()">Tutup</button><button class="pri" onclick="closeModal();show('riset')">Buka Arsip</button></div>`);
            }
            async function exportRiset() {
                const arch = D.daily || [];
                if (!arch.length) return toast('⚠️ Arsip masih kosong');
                toast('⏳ Menyiapkan file Excel arsip…');
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(
                    wb,
                    XLSX.utils.json_to_sheet(
                        arch.map((x) => {
                            const p = x.payload || {};
                            return {
                                Tanggal: x.stat_date,
                                Transaksi: p.transaksi || 0,
                                'Pemasukan Kasir': p.pemasukan_kasir || 0,
                                'Pemasukan Lain': p.pemasukan_lain || 0,
                                'Pemasukan Total': p.pemasukan_total || 0,
                                Pengeluaran: p.pengeluaran || 0,
                                Laba: p.laba || 0,
                                'Jam Tersibuk': Array.isArray(p.jam_tersibuk) ? p.jam_tersibuk[0] + ':00' : '',
                                'Menu Aktif': p.menu_aktif || 0,
                                Catatan: p.catatan || '',
                                'Disimpan oleh': x.user_email || '',
                            };
                        })
                    ),
                    'Rekap Harian'
                );
                const tm = [];
                arch.forEach((x) => ((x.payload || {}).top_menu || []).forEach((t) => tm.push({ Tanggal: x.stat_date, Menu: t.nama, Terjual: t.qty, Pendapatan: t.pendapatan })));
                if (tm.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(tm), 'Menu Terlaris');
                const last = arch[0] && (arch[0].payload || {}).stok;
                if (last && last.length)
                    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(last.map((x) => ({ Bahan: x.nama, Satuan: x.unit, Stok: x.stok, 'Batas Min': x.min }))), 'Stok Terakhir');
                XLSX.writeFile(wb, `arsip-riset-${today()}.xlsx`);
                toast('✅ File Excel arsip sudah diunduh');
            }

            /* ===== KASIR: keranjang ===== */
            function add(id) {
                const c = cart.find((x) => x.id == id);
                c ? c.qty++ : cart.push({ id, qty: 1 });
                drawCart();
            }
            function dec(id) {
                const c = cart.find((x) => x.id == id);
                if (--c.qty <= 0) cart = cart.filter((x) => x !== c);
                drawCart();
            }
            function removeLine(id) {
                cart = cart.filter((x) => x.id != id);
                drawCart();
            }
            function drawCart() {
                const el = $('#cart');
                if (!el) return;
                let tot = 0;
                const rows = cart
                    .map((c) => {
                        const m = D.menu_items.find((x) => x.id == c.id);
                        tot += m.price * c.qty;
                        return `<div class="cline"><span class="nm">${iconFor(m, 18)} ${esc(m.name)}</span>
                    <span class="qtybox"><button onclick="dec(${c.id})">−</button><span class="q">${c.qty}</span><button onclick="add(${c.id})">+</button></span>
                    <span class="sub">${rp(m.price * c.qty)}</span>
                    <button style="width:32px;height:32px;padding:0;color:var(--mut)" title="Hapus" onclick="removeLine(${c.id})">${lic('hapus', 15)}</button></div>`;
                    })
                    .join('');
                el.innerHTML =
                    (cart.length
                        ? rows +
                          `<div class="totalbar"><span>Total</span><b>${rp(tot)}</b></div>` +
                          `<div class="field" style="margin-bottom:8px"><label>Nomor Meja <small>(kosongkan jika bungkus/tampung)</small></label><input id="tb" placeholder="Contoh: 5"></div>
                    <label style="font-size:12.5px;font-weight:700">Metode pembayaran:</label>
                    <div class="paym">${[['Tunai'], ['QRIS'], ['Transfer']].map((p) => `<button data-p="${p[0]}" class="${p[0] === payMethod ? 'on' : ''}" onclick="setPay('${p[0]}')"><i>${lic(p[0] == 'Tunai' ? 'bayar' : p[0] == 'QRIS' ? 'qris' : 'transfer', 20)}</i>${p[0]}</button>`).join('')}</div>
                    <button class="pri big" style="width:100%" onclick="payAsk()">Bayar Sekarang</button>`
                        : `<div class="empty"><div class="e">${lic('pesan', 40)}</div><p>Keranjang masih kosong.<br>Ketuk salah satu menu di sebelah kiri untuk mulai.</p></div>`);
            }
            let payMethod = 'Tunai';
            function setPay(p) {
                payMethod = p;
                drawCart();
            }
            function payAsk() {
                if (!cart.length) return;
                const tot = cart.reduce((a, c) => a + D.menu_items.find((x) => x.id == c.id).price * c.qty, 0);
                    confirmDlg(
                    lic('bayar', 36),
                    `Konfirmasi Pembayaran ${rp(tot)}?`,
                    `Metode: <b>${payMethod}</b>${$('#tb') && $('#tb').value ? ' • Meja: <b>' + esc($('#tb').value) + '</b>' : ''}<br>Konfirmasi jika uang/customer sudah sesuai.`,
                    'doPay()',
                    'Ya, Bayar'
                );
            }
            async function doPay() {
                closeModal();
                const tbEl = $('#tb');
                const { data, error } = await sb.rpc('checkout', {
                    p_table: tbEl ? tbEl.value : '',
                    p_method: payMethod,
                    p_items: cart,
                });
                if (error) return toast('⚠️ Gagal: ' + error.message);
                cart = [];
                payMethod = 'Tunai';
                modal(`<div class="sucess-c"><div class="xn" style="color:var(--ok)">${lic('ok', 44, 2.4)}</div><h2>Pesanan Berhasil!</h2>
                <p class="desc">No. Pesanan <b>#${data}</b> sudah tersimpan dan stok bahan otomatis berkurang.</p>
                <div class="receipt">Terima kasih! Silakan lanjut melayani pelanggan berikutnya.</div>
                <div class="mbtns"><button onclick="closeModal()">Tutup</button><button class="pri" onclick="closeModal();show('kasir')">Buat Pesanan Baru</button></div></div>`);
                load();
                autoSnap();
            }

            /* ===== MENU actions ===== */
            function addMenu() {
                const n = $('#n').value.trim();
                if (!n) return toast('⚠️ Isi dulu nama menunya ya');
                run(sb.from('menu_items').insert({ name: n, category: $('#c').value.trim(), price: +$('#pr').value || 0 }), 'Menu "' + n + '" berhasil ditambahkan');
            }
            function toggleMenu(id, active) {
                run(sb.from('menu_items').update({ active }).eq('id', id), active ? 'Menu ditampilkan di kasir' : 'Menu disembunyikan dari kasir');
            }
            function priceDlg(id) {
                const m = D.menu_items.find((x) => x.id == id);
                modal(`<div class="xic">${lic('bayar', 36)}</div><h3>Ubah Harga — ${esc(m.name)}</h3><p class="desc">Harga sekarang: <b>${rp(m.price)}</b>. Tulis harga baru tanpa titik, contoh: 15000</p>
                <div class="field"><label>Harga Baru (Rp)</label><input id="mp" type="number" min="0" value="${m.price}"></div>
                <div class="mbtns"><button onclick="closeModal()">Batal</button><button class="pri" onclick="savePrice(${id})">Simpan Harga</button></div>`);
            }
            function savePrice(id) {
                const v = +$('#mp').value;
                if (!v) return toast('⚠️ Harga tidak boleh kosong / nol');
                closeModal();
                run(sb.from('menu_items').update({ price: v }).eq('id', id), 'Harga berhasil diubah');
            }
            function recipeDlg(id) {
                const m = D.menu_items.find((x) => x.id == id);
                const cur = D.recipes
                    .filter((r) => r.menu_id == id)
                    .map((r) => (D.ingredients.find((i) => i.id == r.ingredient_id) || {}).name + '=' + r.qty)
                    .join(', ');
                if (!D.ingredients.length) return toast('⚠️ Tambahkan bahan baku dulu di tab "Bahan Baku"');
                modal(`<div class="xic">${lic('menu', 36)}</div><h3>Resep per Porsi — ${esc(m.name)}</h3>
                <p class="desc">Format penulisan: <b>Nama Bahan=jumlah</b>, dipisah koma.<br>Contoh: <b>Beras=150, Ayam=100</b><br>(artinya tiap 1 porsi pakai 150 gr beras & 100 gr ayam)</p>
                <div class="field"><label>Daftar bahan tersedia:</label><small class="mut">${esc(D.ingredients.map((i) => i.name + ' (' + i.unit + ')').join(', '))}</small></div>
                <div class="field" style="margin-top:8px"><label>Resep</label><input id="rc" value="${esc(cur)}" placeholder="Beras=150, Ayam=100"></div>
                <div class="mbtns"><button onclick="closeModal()">Batal</button><button class="pri" onclick="saveRecipe(${id})">Simpan Resep</button></div>`);
            }
            async function saveRecipe(id) {
                const v = $('#rc').value;
                closeModal();
                if (!v.trim()) {
                    await sb.from('recipes').delete().eq('menu_id', id);
                    return toast('✅ Resep dikosongkan');
                }
                const rows = [];
                for (const p of v.split(',').filter((x) => x.trim())) {
                    const [n, q] = p.split('=');
                    const i = D.ingredients.find((x) => x.name.toLowerCase() == (n || '').trim().toLowerCase());
                    if (!i) return toast('⚠️ Bahan "' + n.trim() + '" tidak ditemukan. Cek ejaan namanya di tab "Bahan Baku"');
                    rows.push({ menu_id: id, ingredient_id: i.id, qty: +q });
                }
                await sb.from('recipes').delete().eq('menu_id', id);
                if (rows.length) await run(sb.from('recipes').insert(rows), 'Resep berhasil disimpan');
                else load();
            }

            /* ===== BAHAN actions ===== */
            async function addIng() {
                const n = $('#n').value.trim();
                if (!n) return toast('⚠️ Isi dulu nama bahannya ya');
                const { data, error } = await sb
                    .from('ingredients')
                    .insert({ name: n, unit: $('#u').value.trim() || 'gr', min_stock: +$('#mn').value || 0, cost: +$('#co').value || 0 })
                    .select()
                    .single();
                if (error) return toast('⚠️ Gagal: ' + (error.message.includes('duplicate') ? 'Nama bahan sudah dipakai' : error.message));
                if (+$('#s').value)
                    await sb.from('stock_moves').insert({ ingredient_id: data.id, qty: +$('#s').value, type: 'initial', note: 'Stok awal' });
                toast('✅ Bahan "' + n + '" berhasil ditambahkan');
                load();
            }
            function stockIn(id) {
                const i = D.ingredients.find((x) => x.id == id);
                modal(`<div class="xic">${lic('bahan', 36)}</div><h3>Beli / Tambah Stok — ${esc(i.name)}</h3>
                <p class="desc">Tulis <b>jumlah yang dibeli</b> dalam ${esc(i.unit)}. Stok akan bertambah otomatis. Jika harga/satuan sudah diisi, biaya belanja otomatis masuk ke catatan Biaya.</p>
                <div class="field"><label>Jumlah (${esc(i.unit)})</label><input id="sv" type="number" min="0.01" step="any"></div>
                <div class="field" style="margin-top:8px"><label>Catatan <small>(boleh kosong)</small></label><input id="sn" placeholder="Contoh: beli di pasar"></div>
                <div class="mbtns"><button onclick="closeModal()">Batal</button><button class="pri" onclick="saveMove(${id},1)">Masukkan Stok</button></div>`);
            }
            function stockOut(id) {
                const i = D.ingredients.find((x) => x.id == id);
                modal(`<div class="xic" style="color:var(--bad)">${lic('hapus', 36)}</div><h3>Kurangi Stok — ${esc(i.name)}</h3>
                <p class="desc">Untuk bahan terbuang/spoiled atau salah hitung. Tulis jumlah yang <b>dikurangi</b> dalam ${esc(i.unit)}.</p>
                <div class="field"><label>Jumlah (${esc(i.unit)})</label><input id="sv" type="number" min="0.01" step="any"></div>
                <div class="field" style="margin-top:8px"><label>Alasan <small>(boleh kosong)</small></label><input id="sn" placeholder="Contoh: basi / terbuang"></div>
                <div class="mbtns"><button onclick="closeModal()">Batal</button><button class="pri" style="background:var(--bad);border-color:var(--bad)" onclick="saveMove(${id},-1)">Kurangi Stok</button></div>`);
            }
            async function saveMove(id, sign) {
                const i = D.ingredients.find((x) => x.id == id),
                    v = +$('#sv').value;
                if (!v) return toast('⚠️ Isi jumlahnya dulu ya');
                const note = $('#sn').value.trim();
                closeModal();
                await sb.from('stock_moves').insert({ ingredient_id: id, qty: sign * v, type: sign > 0 ? 'purchase' : 'waste', note });
                if (sign > 0 && i.cost)
                    await sb.from('expenses').insert({ category: 'Bahan Baku', amount: v * i.cost, note: `Beli ${i.name} ${v}${i.unit}` });
                toast(sign > 0 ? '✅ Stok ditambah' : '✅ Stok dikurangi');
                load();
            }

            /* ===== BIAYA & PEMASUKAN ===== */
            function addExp() {
                const a = +$('#a').value;
                if (!a) return toast('⚠️ Isi dulu jumlahnya ya');
                const rec = { category: $('#c').value, amount: a, note: $('#n').value.trim(), kind: expKind };
                sb.from('expenses')
                    .insert(rec)
                    .then(async ({ error }) => {
                        if (error && error.message.includes('kind')) {
                            const { error: e2 } = await sb.from('expenses').insert({ category: rec.category, amount: rec.amount, note: rec.note });
                            if (e2) return toast('⚠️ Gagal: ' + e2.message + '\n\nJalankan pembaruan kolom "kind" di Supabase (lihat Schema.sql)');
                        } else if (error) return toast('⚠️ Gagal: ' + error.message);
                        toast('✅ ' + (expKind == 'keluar' ? 'Pengeluaran' : 'Pemasukan') + ' berhasil dicatat');
                        load();
                    });
            }

            /* ===== HAPUS DATA (semua halaman) ===== */
            function delMenu(id) {
                const m = D.menu_items.find((x) => x.id == id) || {};
                confirmDlg(lic('hapus', 36), `Hapus menu "${esc(m.name)}"?`, 'Menu dan resepnya akan terhapus permanen dari daftar. Riwayat penjualan lama tetap tersimpan di Laporan.', `doDel(${id},'menu_items')`, 'Ya, Hapus Menu');
            }
            function delIng(id) {
                const i = D.ingredients.find((x) => x.id == id) || {};
                confirmDlg(lic('hapus', 36), `Hapus bahan "${esc(i.name)}"?`, 'Bahan beserta resep dan catatan stoknya akan terhapus permanen. Riwayat aktivitas tetap tercatat.', 'doDelIng(' + id + ')', 'Ya, Hapus Bahan');
            }
            function delExp(id) {
                confirmDlg(lic('hapus', 36), 'Hapus catatan biaya ini?', 'Catatan terhapus tidak bisa dikembalikan. Angka di Laporan akan ikut menyesuaikan otomatis.', `doDel(${id},'expenses')`, 'Ya, Hapus');
            }
            function delOrder(id) {
                confirmDlg(lic('hapus', 36), `Hapus transaksi #${id}?`, 'Transaksi dihapus dari laporan, dan stok bahan yang tadi berkurang akan <b>dikembalikan otomatis</b>. Gunakan hanya jika pencatatan keliru.', 'doDelOrder(' + id + ')', 'Ya, Hapus Transaksi');
            }
            async function doDel(id, tbl) {
                closeModal();
                const row = (tbl == 'menu_items' ? D.menu_items : D.expenses).find((x) => x.id == id) || {};
                const { error } = await sb.from(tbl).delete().eq('id', id);
                if (error) return toast('⚠️ Gagal: ' + error.message);
                const oklog = await logEvent(tbl == 'menu_items' ? 'HAPUS_MENU' : 'HAPUS_BIAYA', {
                    id,
                    nama: row.name || row.category || '',
                    nilai: +row.price || +row.amount || 0,
                });
                toast(oklog ? '✅ Data berhasil dihapus (tercatat di Riwayat)' : '✅ Terhapus, tapi riwayat belum aktif — buka tab Riwayat untuk petunjuk SQL');
                load();
            }
            async function doDelIng(id) {
                closeModal();
                const i = D.ingredients.find((x) => x.id == id) || {};
                toast('⏳ Menghapus stok & resep…');
                await sb.from('stock_moves').delete().eq('ingredient_id', id);
                const { error } = await sb.from('ingredients').delete().eq('id', id);
                if (error) return toast('⚠️ Gagal: ' + error.message);
                const oklog = await logEvent('HAPUS_BAHAN', { id, nama: i.name, stok: i.stock, satuan: i.unit });
                toast(oklog ? '✅ Bahan baku berhasil dihapus (tercatat di Riwayat)' : '✅ Terhapus, tapi riwayat belum aktif — buka tab Riwayat untuk petunjuk SQL');
                load();
            }
            async function doDelOrder(id) {
                closeModal();
                const o = D.orders.find((x) => x.id == id) || { total: 0 };
                toast('⏳ Membatalkan transaksi & mengembalikan stok…');
                const { data: oi } = await sb.from('order_items').select('*').eq('order_id', id);
                for (const it of oi || [])
                    for (const r of D.recipes.filter((x) => x.menu_id == it.menu_id))
                        await sb.from('stock_moves').insert({ ingredient_id: r.ingredient_id, qty: r.qty * it.qty, type: 'koreksi', note: 'Pembatalan Order #' + id });
                const e1 = (await sb.from('order_items').delete().eq('order_id', id)).error;
                if (e1) return toast('⚠️ Gagal: ' + e1.message);
                const e2 = (await sb.from('orders').delete().eq('id', id)).error;
                if (e2) return toast('⚠️ Gagal: ' + e2.message);
                const oklog = await logEvent('HAPUS_TRANSAKSI', { order: id, total: +o.total, metode: o.payment_method, meja: o.table_no || '' });
                toast(oklog ? '✅ Transaksi #' + id + ' dihapus, stok dikembalikan (tercatat di Riwayat)' : '✅ Transaksi #' + id + ' dihapus & stok kembali — riwayat belum aktif, buka tab Riwayat');
                load();
            }

            /* ===== LAPORAN ===== */
            function quickDate(n) {
                from = new Date(Date.now() - n * 864e5 - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
                to = today();
                V.laporan();
            }
            async function exportXls() {
                toast('⏳ Sedang menyiapkan file Excel…');
                const { data: oi } = await sb.from('order_items').select('*').order('id');
                const wb = XLSX.utils.book_new(),
                    A = (n, r) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(r), n);
                A('Penjualan', D.orders.filter(inRange));
                A('Detail Item', oi || []);
                A('Pengeluaran', D.expenses.filter((x) => inRange(x) && (x.kind || 'keluar') == 'keluar'));
                A('Pemasukan Lain', D.expenses.filter((x) => inRange(x) && x.kind == 'masuk'));
                A('Stok Bahan', D.ingredients);
                A('Mutasi Stok', D.stock_moves.filter(inRange));
                A('Menu', D.menu_items);
                const { data: lg } = await sb.from('activity_log').select('*').gte('created_at', from).lte('created_at', to + 'T23:59:59').order('id');
                A('Riwayat Aktivitas', (lg || []).map((l) => ({ ...l, detail: JSON.stringify(l.detail) })));
                XLSX.writeFile(wb, `laporan-warung-${from}sd${to}.xlsx`);
                toast('✅ File Excel sudah diunduh');
            }

            start();
        </script>
    </body>
</html>
